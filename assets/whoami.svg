<svg viewBox="0 0 1000 248" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Short bio, focus, and current status">
  <style>
    :root { --bone:#444444;--rule:#C0C0C0;--muted:#888888;--dim:#AAAAAA;--accent:#555555;--ghost:#CCCCCC; }
    
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .75s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.12s} .a2{animation-delay:.24s} .a3{animation-delay:.36s} .a4{animation-delay:.48s}
    .a5{animation-delay:.6s} .a6{animation-delay:.72s} .a7{animation-delay:.84s} .a8{animation-delay:.96s}
    .a9{animation-delay:1.08s} .a10{animation-delay:1.2s}
    .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.2s cubic-bezier(.6,0,.2,1) forwards; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.axis,.pulse,.ring { animation: none; }
      .draw,.axis { stroke-dashoffset: 0; }
      .rise,.fade { opacity: 1; }
      .ring { opacity: 0; }
    }

  </style>
  
  <text class="mono rise a1" x="48" y="34" font-size="16" fill="var(--bone)">M.Sc. student in Bioinformatics and Systems Biology, Gebze Technical University.</text>
  <text class="mono rise a2" x="48" y="62" font-size="16" fill="var(--bone)">Genome Analyst Trainee at Gen Era Diagnostics Inc.</text>
  <text class="mono rise a3" x="48" y="90" font-size="16" fill="var(--bone)">B.Sc. Bioengineering, Istanbul Medeniyet University.</text>
  <line class="rise a4" x1="48" y1="118" x2="952" y2="118" stroke="var(--rule)" stroke-width="1" opacity=".55"/>
  <text class="mono rise a5" x="48" y="154" font-size="11" fill="var(--muted)" letter-spacing="2.2">FOCUS  ▸</text>
  <text class="mono rise a5" x="150" y="154" font-size="15" fill="var(--bone)">Genome-scale metabolic modeling · Pan-cancer multi-omics · Variant annotation</text>
  <text class="mono rise a6" x="48" y="188" font-size="11" fill="var(--muted)" letter-spacing="2.2">STATUS  ▸</text>
  <text class="mono rise a6" x="150" y="188" font-size="15" fill="var(--accent)">M.Sc. in progress · Genome Analyst Trainee at Gen Era Diagnostics Inc.</text>
  <text class="mono rise a7" x="48" y="222" font-size="11" fill="var(--muted)" letter-spacing="2.2">PATH  ▸</text>
  <text class="mono rise a7" x="150" y="222" font-size="15" fill="var(--bone)">Bioengineering, then bioinformatics.</text>

</svg>
