<svg viewBox="0 0 1000 726" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Publications, presentations, and projects">
  <style>
    :root { --bone:#E6E6E6;--rule:#3A3A3A;--muted:#9A9A9A;--dim:#707070;--accent:#D0D0D0;--ghost:#2A2A2A; }
    
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .75s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.12s} .a2{animation-delay:.24s} .a3{animation-delay:.36s} .a4{animation-delay:.48s}
    .a5{animation-delay:.6s} .a6{animation-delay:.72s} .a7{animation-delay:.84s} .a8{animation-delay:.96s}
    .a9{animation-delay:1.08s} .a10{animation-delay:1.2s}
    .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.2s cubic-bezier(.6,0,.2,1) forwards; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.axis,.pulse,.ring { animation: none; }
      .draw,.axis { stroke-dashoffset: 0; }
      .rise,.fade { opacity: 1; }
      .ring { opacity: 0; }
    }

  </style>
  <g class="rise a1">
<text class="mono" x="48" y="42" font-size="16" font-weight="700" letter-spacing="0.6" fill="var(--bone)">01  /  HIBIT 2026</text>
<text class="mono" x="48" y="64" font-size="15" fill="var(--bone)">Metabolic Network Analysis and Genome-Scale Metabolic Modeling</text>
<text class="mono" x="48" y="86" font-size="15" fill="var(--bone)">in Multi-Omics Pan-Adenocarcinoma Data</text>
<text class="mono" x="48" y="108" font-size="13.5" fill="var(--muted)">Demir Ö. · Tut B. · Kurtağzı A. · Karabekmez M. E.</text>
<text class="mono" x="48" y="130" font-size="13.5" fill="var(--muted)">19th International Symposium on Health Informatics and Bioinformatics</text>
<text class="mono" x="48" y="152" font-size="11.5" letter-spacing="0.8" fill="var(--accent)">POSTER  ·  ACIBADEM UNIVERSITY, ISTANBUL  ·  13–15 NOVEMBER 2026</text>
<text class="mono" x="48" y="174" font-size="11.5" letter-spacing="0.8" fill="var(--accent)">NOT YET PUBLISHED</text>
<line x1="48" y1="192" x2="952" y2="192" stroke="var(--rule)" stroke-width="1" opacity=".7"/>
</g>
<g class="rise a2">
<text class="mono" x="48" y="236" font-size="16" font-weight="700" letter-spacing="0.6" fill="var(--bone)">02  /  TUPA 2025</text>
<text class="mono" x="48" y="258" font-size="15" fill="var(--bone)">Pan-Cancer Adenocarcinoma Analysis through Weighted Reaction Co-Expression Networks</text>
<text class="mono" x="48" y="280" font-size="13.5" fill="var(--muted)">Demir Ö. · Tut B. · Karabekmez M. E.</text>
<text class="mono" x="48" y="302" font-size="11.5" letter-spacing="0.8" fill="var(--accent)">POSTER  ·  TUPA INTERNATIONAL PROTEOMICS CONGRESS</text>
<text class="mono" x="48" y="324" font-size="11.5" letter-spacing="0.8" fill="var(--accent)">7TH TURKISH NATIONAL PROTEOMICS CONGRESS  ·  2025</text>
<line x1="48" y1="342" x2="952" y2="342" stroke="var(--rule)" stroke-width="1" opacity=".7"/>
</g>
<g class="rise a3">
<text class="mono" x="48" y="386" font-size="16" font-weight="700" letter-spacing="0.6" fill="var(--bone)">03  /  TÜBİTAK 2209-A</text>
<text class="mono" x="48" y="408" font-size="15" fill="var(--bone)">Integrative Analysis of Pan-Cancer Adenocarcinoma Gene Expression</text>
<text class="mono" x="48" y="430" font-size="15" fill="var(--bone)">and Metabolic Pathways with WRCNA and RSEA</text>
<text class="mono" x="48" y="452" font-size="13.5" fill="var(--muted)">Principal investigator · Ömer Demir    Researcher · Berkan Tut</text>
<text class="mono" x="48" y="474" font-size="13.5" fill="var(--muted)">Advisor · Asst. Prof. Muhammed Erkan Karabekmez</text>
<text class="mono" x="48" y="496" font-size="11.5" letter-spacing="0.8" fill="var(--accent)">TÜBİTAK-BİDEB 2209-A  ·  2024  ·  PROJECT NO. 1919B012426</text>
<line x1="48" y1="514" x2="952" y2="514" stroke="var(--rule)" stroke-width="1" opacity=".7"/>
</g>
<g class="rise a4">
<text class="mono" x="48" y="558" font-size="16" font-weight="700" letter-spacing="0.6" fill="var(--bone)">04  /  TEKNOFEST 2024</text>
<text class="mono" x="48" y="580" font-size="15" fill="var(--bone)">CRISPR-dCas13 RNA base editing of the GLUA2 Q site</text>
<text class="mono" x="48" y="602" font-size="15" fill="var(--bone)">to prevent TDP-43 aggregation in ALS</text>
<text class="mono" x="48" y="624" font-size="13.5" fill="var(--muted)">Saytaş A. · Özmenteşe B. N. · Demir Ö. · Polat Y. · İşdar Z.</text>
<text class="mono" x="48" y="646" font-size="13.5" fill="var(--muted)">Advisor · Prof. Sevgi Maraklı</text>
<text class="mono" x="48" y="668" font-size="11.5" letter-spacing="0.8" fill="var(--accent)">FINALIST · 8TH PLACE · BEST PRESENTATION AWARD</text>
<text class="mono" x="48" y="690" font-size="11.5" letter-spacing="0.8" fill="var(--accent)">RARE DISEASES GENETIC THERAPY  ·  UNIVERSITY AND ABOVE</text>
<line x1="48" y1="708" x2="952" y2="708" stroke="var(--rule)" stroke-width="1" opacity=".7"/>
</g>
</svg>
