<svg viewBox="0 0 1000 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Computational and laboratory skills">
  <style>
    :root { --bone:#E6E6E6;--rule:#3A3A3A;--muted:#9A9A9A;--dim:#707070;--accent:#D0D0D0;--ghost:#2A2A2A; }
    
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .75s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.12s} .a2{animation-delay:.24s} .a3{animation-delay:.36s} .a4{animation-delay:.48s}
    .a5{animation-delay:.6s} .a6{animation-delay:.72s} .a7{animation-delay:.84s} .a8{animation-delay:.96s}
    .a9{animation-delay:1.08s} .a10{animation-delay:1.2s}
    .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.2s cubic-bezier(.6,0,.2,1) forwards; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.axis,.pulse,.ring { animation: none; }
      .draw,.axis { stroke-dashoffset: 0; }
      .rise,.fade { opacity: 1; }
      .ring { opacity: 0; }
    }

  </style>
  <line x1="168" y1="12" x2="168" y2="350" stroke="var(--rule)" stroke-width="1" opacity=".45"/>
<text class="mono rise a1" x="48" y="28" font-size="12" fill="var(--muted)" letter-spacing="1.6">CODE</text>
<text class="mono rise a1" x="188" y="28" font-size="15" fill="var(--bone)">Python · R · MATLAB</text>
<text class="mono rise a2" x="48" y="62" font-size="12" fill="var(--muted)" letter-spacing="1.6">OMICS</text>
<text class="mono rise a2" x="188" y="62" font-size="15" fill="var(--bone)">Genomics · Transcriptomics · Proteomics · Variant analysis and annotation</text>
<text class="mono rise a3" x="48" y="96" font-size="12" fill="var(--muted)" letter-spacing="1.6">MODELS</text>
<text class="mono rise a3" x="188" y="96" font-size="15" fill="var(--bone)">Systems biology · Genome-scale metabolic modeling · Statistical analysis</text>
<text class="mono rise a4" x="48" y="130" font-size="12" fill="var(--muted)" letter-spacing="1.6">NETWORKS</text>
<text class="mono rise a4" x="188" y="130" font-size="15" fill="var(--bone)">Cytoscape</text>
<text class="mono rise a5" x="48" y="164" font-size="12" fill="var(--muted)" letter-spacing="1.6">STRUCTURE</text>
<text class="mono rise a5" x="188" y="164" font-size="15" fill="var(--bone)">PyMOL · Chimera · Coot</text>
<text class="mono rise a6" x="48" y="198" font-size="12" fill="var(--muted)" letter-spacing="1.6">TOOLS</text>
<text class="mono rise a6" x="188" y="198" font-size="15" fill="var(--bone)">Docker · Git · GitHub · Linux · Nextflow · nf-core</text>
<text class="mono rise a7" x="48" y="232" font-size="12" fill="var(--muted)" letter-spacing="1.6">PLATFORMS</text>
<text class="mono rise a7" x="188" y="232" font-size="15" fill="var(--bone)">Illumina DRAGEN · GenomeStudio</text>
<text class="mono rise a8" x="48" y="266" font-size="12" fill="var(--muted)" letter-spacing="1.6">NUCLEIC</text>
<text class="mono rise a8" x="188" y="266" font-size="15" fill="var(--bone)">DNA/RNA isolation · PCR · Fragment analysis · Karyotyping · G-banding</text>
<text class="mono rise a9" x="48" y="300" font-size="12" fill="var(--muted)" letter-spacing="1.6">PROTEIN</text>
<text class="mono rise a9" x="188" y="300" font-size="15" fill="var(--bone)">Recombinant expression and purification · Crystallization · Enzyme kinetics</text>
<text class="mono rise a10" x="48" y="334" font-size="12" fill="var(--muted)" letter-spacing="1.6">CELLS</text>
<text class="mono rise a10" x="188" y="334" font-size="15" fill="var(--bone)">Cell culture · Spectrophotometry · Aseptic technique · Microbial culture</text>
</svg>
